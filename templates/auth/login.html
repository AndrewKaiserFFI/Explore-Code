{% extends "base.html" %}
{% block content %}
<h2>Log In</h2>
<form method="POST" novalidate>
  {{ form.hidden_tag() }}
  <p>{{ form.username.label }} {{ form.username(size=32) }}</p>
  <p>{{ form.password.label }} {{ form.password(size=32) }}</p>
  {{ form.submit() }}
</form>
<p>Need an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
{% endblock %}
